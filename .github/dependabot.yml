version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Vienna
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      better-auth:
        patterns:
          - better-auth
          - "@better-auth/*"
      next-react:
        patterns:
          - next
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
