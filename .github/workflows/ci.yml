name: CI

# Checks every pull request and every push to main. Deploys happen in Coolify, which builds
# the Dockerfile from main.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Next runs on Node; package.json asks for 24+.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      # Formatting, lint rules and import order in one pass, without writing.
      - run: bunx biome ci .

      - run: bun run lint
      - run: bun run typecheck

      - run: bun run build

      # Builds the same image Coolify deploys, so a broken Dockerfile shows up in the PR.
      - name: Build the Docker image
        run: docker build --tag sniptide:ci .
