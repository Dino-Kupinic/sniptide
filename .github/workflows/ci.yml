name: CI

# Checks every pull request and every push to main. Deploys happen in Coolify, which builds
# the Dockerfile from main.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Next runs on Node; package.json asks for 24+.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      # Formatting, lint rules and import order in one pass, without writing.
      - run: bunx biome ci .

      - run: bun run lint
      - run: bun run typecheck

      - run: bun run build

      # Builds the same image Coolify deploys, so a broken Dockerfile shows up in the PR.
      - name: Build the Docker image
        run: docker build --tag sniptide:ci .

  # Runs the store and routes against a real Postgres: the access rules and the one-time-read
  # claim live in SQL, so a mock would prove nothing.
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sniptide
          POSTGRES_PASSWORD: sniptide
          POSTGRES_DB: sniptide_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sniptide -d sniptide_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://sniptide:sniptide@localhost:5432/sniptide_test
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - run: bun run test
        working-directory: apps/web
