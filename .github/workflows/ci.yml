name: CI

# Checks every pull request and every push to main. Publishing an image does not deploy it.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plan:
    name: Select test suites
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
      contents: read
    outputs:
      cli: ${{ steps.select.outputs.cli }}
      container: ${{ steps.select.outputs.container }}
      extension: ${{ steps.select.outputs.extension }}
      raycast: ${{ steps.select.outputs.raycast }}
      sdk: ${{ steps.select.outputs.sdk }}
      shards: ${{ steps.select.outputs.shards }}
      shared: ${{ steps.select.outputs.shared }}
      vscode: ${{ steps.select.outputs.vscode }}
      web: ${{ steps.select.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Compare the checked-out PR merge commit with its base parent.
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Plan test suites and browser shards
        id: select
        env:
          CI_PR_BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-plan.mjs

  lint:
    name: Lint and check unused code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile

      # scripts/attach-pr-media.sh removes the temporary screenshot files before merging.
      - name: Keep pull request media out of the tree
        run: test ! -e .pr-media || { echo "::error::Remove .pr-media before merging."; exit 1; }
      - run: bun run lint:ci
      - run: bun run check:unused

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  client-builds:
    name: Build editor extensions
    needs: plan
    if: needs.plan.outputs.extension == 'true' || needs.plan.outputs.vscode == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - if: needs.plan.outputs.extension == 'true'
        run: bun --filter extension build
      - if: needs.plan.outputs.vscode == 'true'
        run: bun --filter sniptide-vscode build

  package-tests:
    name: Package, documentation and tooling tests
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: npm install --global npm@12.2.1
      - run: node --test scripts/test-npm-pack.mjs
      - run: npm pack @sniptide/mcp@0.1.0 --pack-destination "$RUNNER_TEMP"
      - run: node --test scripts/test-release-gates.mjs
        env:
          LEGACY_MCP_TARBALL: ${{ runner.temp }}/sniptide-mcp-0.1.0.tgz
      - run: node --test scripts/test-ci-plan.mjs
      - run: bash scripts/test-ci-image-tag.sh
      - run: bash scripts/test-ci-containers-parallel.sh
      - run: bash scripts/test-coolify-backup.sh
      - run: node --test scripts/test-deploy-production.mjs scripts/test-pre-deploy-backup.mjs scripts/test-deploy-preview.mjs scripts/test-reconcile-previews.mjs scripts/test-healthcheck.mjs
      - run: node --test scripts/test-package-releases.mjs
      - run: node --test scripts/test-release-notes.mjs

      - if: needs.plan.outputs.shared == 'true'
        run: bun run test:contracts
      - if: needs.plan.outputs.cli == 'true'
        run: bun run test:cli
      - if: needs.plan.outputs.shared == 'true'
        run: bun run test:mcp
      - if: needs.plan.outputs.sdk == 'true'
        run: bun run test:sdk
      - if: needs.plan.outputs.extension == 'true'
        run: bun run test:extension
      - if: needs.plan.outputs.vscode == 'true'
        run: bun run test:vscode
      - if: needs.plan.outputs.raycast == 'true'
        run: bun run test:raycast
      - if: needs.plan.outputs.sdk == 'true'
        run: node packages/sdk/scripts/test-npm-release.mjs
      - if: needs.plan.outputs.shared == 'true'
        run: node packages/mcp/scripts/test-npm-release.mjs
      - if: needs.plan.outputs.shared == 'true'
        run: node scripts/npm-release.mjs ui "$RUNNER_TEMP/ui-package"
      - if: needs.plan.outputs.shared == 'true'
        run: node packages/ui/scripts/test-npm-release.mjs "$RUNNER_TEMP/ui-package"
      - run: bun run test:docs

  # Branch protection requires this check name.
  checks:
    name: Lint, typecheck and build
    needs: [plan, lint, typecheck, client-builds, package-tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require the selected checks to pass
        env:
          PLAN: ${{ needs.plan.result }}
          LINT: ${{ needs.lint.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          BUILDS: ${{ needs.client-builds.result }}
          TESTS: ${{ needs.package-tests.result }}
        run: |
          [[ "$PLAN" == success && "$LINT" == success && "$TYPECHECK" == success &&
             "$TESTS" == success && ( "$BUILDS" == success || "$BUILDS" == skipped ) ]]

  # Build and test in parallel with the other checks; publishing waits for all of them.
  docker:
    name: Docker image, upgrade and compose
    needs: plan
    outputs:
      build-attempt: ${{ github.run_attempt }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Build the Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: sniptide:ci
          build-args: DEPLOYMENT_VERSION=${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: |
            type=gha,scope=ci-web
            type=gha,scope=docker-amd64
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=ci-web,ignore-error=true,timeout=90s' || '' }}

      - name: Find the latest release image
        if: needs.plan.outputs.container == 'true'
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          image=""
          if [ -n "$tag" ]; then
            image="ghcr.io/${GITHUB_REPOSITORY,,}:${tag#v}"
            if ! docker manifest inspect "$image" >/dev/null 2>&1; then
              echo "::warning::$image isn't published yet, so the upgrade check is skipped."
              image=""
            fi
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Verify the image and self-hosting setups
        env:
          FULL_CONTAINER_CHECKS: ${{ needs.plan.outputs.container }}
          PREVIOUS_IMAGE: ${{ steps.previous.outputs.image }}
        run: bash scripts/test-ci-containers.sh sniptide:ci "$PREVIOUS_IMAGE"

      - name: Build and check the Coolify backup image
        if: needs.plan.outputs.container == 'true'
        run: |
          for major in 17 18; do
            docker build --build-arg "POSTGRES_MAJOR=$major" -t "sniptide-backup:ci-$major" \
              -f deploy/coolify/backup.Dockerfile deploy/coolify
            docker run --rm --entrypoint /bin/sh "sniptide-backup:ci-$major" -ec '
              pg_dump --version && pg_restore --version && age --version && rclone version
              flock -w 1 /tmp/backup.lock /bin/true
              date -u "+%G-W%V" | grep -Eq "^[0-9]{4}-W[0-9]{2}$"
            '
          done

      - name: Select a tag for trusted events
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          ACTOR: ${{ github.actor }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          tag="$(bash scripts/ci-image-tag.sh "$REPOSITORY" "$EVENT" "$REF" "$HEAD_REPOSITORY" "$SHA" "$RUN_ID" "$ATTEMPT" "$ACTOR" "$AUTHOR")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Save the tested image
        if: steps.image.outputs.tag != ''
        run: docker save sniptide:ci -o "$RUNNER_TEMP/sniptide-image.tar"

      - name: Upload the tested image
        if: steps.image.outputs.tag != ''
        uses: actions/upload-artifact@v4
        with:
          name: tested-web-image-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sniptide-image.tar
          retention-days: 1

  publish-ci-image:
    name: Publish tested CI image
    needs: [docker, checks, tests-result, e2e-result, docs-image]
    # A skipped job anywhere upstream, such as the editor extension build, would skip this job too.
    # Gate on the direct needs instead; checks, tests-result and e2e-result already judge skipped suites.
    if: ${{ !cancelled() && needs.docker.result == 'success' && needs.checks.result == 'success' && needs.tests-result.result == 'success' && needs.e2e-result.result == 'success' && needs.docs-image.result == 'success' && github.actor != 'dependabot[bot]' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Validate the build attempt
        id: build
        env:
          BUILD_ATTEMPT: ${{ needs.docker.outputs.build-attempt }}
        run: |
          [[ "$BUILD_ATTEMPT" =~ ^[0-9]+$ ]] || { echo 'Invalid build attempt' >&2; exit 1; }
          echo "attempt=$BUILD_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: tested-web-image-${{ steps.build.outputs.attempt }}
          path: ${{ runner.temp }}
      - name: Load the tested image
        run: docker load -i "$RUNNER_TEMP/sniptide-image.tar"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested image
        id: publish
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ steps.build.outputs.attempt }}
        run: |
          if [[ ! "$REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] ||
             [[ ! "$SHA" =~ ^[a-f0-9]{40}$ ]] || [[ ! "$RUN_ID" =~ ^[0-9]+$ ]] ||
             [[ ! "$ATTEMPT" =~ ^[0-9]+$ ]]; then
            echo 'Invalid image destination inputs' >&2
            exit 1
          fi
          IMAGE="ghcr.io/${REPOSITORY,,}:sha-$SHA-$RUN_ID-$ATTEMPT"
          docker tag sniptide:ci "$IMAGE"
          output="$(docker push "$IMAGE")"
          printf '%s\n' "$output"
          digest="$(printf '%s\n' "$output" | sed -nE 's/.*digest: (sha256:[a-f0-9]{64}).*/\1/p' | tail -n 1)"
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo 'Could not find the pushed registry digest' >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published tested image: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Registry digest: \`${IMAGE%:*}@$digest\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Record the production image receipt
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          BUILD_ATTEMPT: ${{ steps.build.outputs.attempt }}
        run: |
          mkdir -p "$RUNNER_TEMP/image-receipt"
          node -e 'const fs = require("node:fs"); const e = process.env; fs.writeFileSync(`${e.RUNNER_TEMP}/image-receipt/receipt.json`, JSON.stringify({repository:e.GITHUB_REPOSITORY, sha:e.GITHUB_SHA, run_id:e.GITHUB_RUN_ID, run_attempt:e.GITHUB_RUN_ATTEMPT, build_attempt:e.BUILD_ATTEMPT, digest:e.DIGEST}))'
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          name: production-image-receipt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image-receipt/receipt.json
          retention-days: 7

      - name: Record the preview image receipt
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' && github.actor != 'dependabot[bot]' }}
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          BUILD_ATTEMPT: ${{ steps.build.outputs.attempt }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/preview-receipt"
          node -e 'const fs = require("node:fs"); const e = process.env; fs.writeFileSync(`${e.RUNNER_TEMP}/preview-receipt/receipt.json`, JSON.stringify({repository:e.GITHUB_REPOSITORY, merge_sha:e.GITHUB_SHA, head_sha:e.PR_HEAD, base_sha:e.PR_BASE, pr:e.PR_NUMBER, run_id:e.GITHUB_RUN_ID, run_attempt:e.GITHUB_RUN_ATTEMPT, build_attempt:e.BUILD_ATTEMPT, digest:e.DIGEST}))'
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' && github.actor != 'dependabot[bot]' }}
        with:
          name: preview-image-receipt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preview-receipt/receipt.json
          retention-days: 7

  # The docs site deploys as its own Coolify service from apps/docs/Dockerfile.
  docs-image:
    name: Docs Docker image
    outputs:
      build-attempt: ${{ steps.attempt.outputs.value }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build the docs Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/docs/Dockerfile
          load: true
          tags: sniptide-docs:ci
          cache-from: type=gha,scope=ci-docs
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=ci-docs,ignore-error=true,timeout=90s' || '' }}

      - name: Verify the docs Docker image
        run: bash scripts/test-docs-image.sh sniptide-docs:ci

      - name: Record the build attempt
        id: attempt
        run: echo "value=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Save the tested docs image
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: docker save sniptide-docs:ci -o "$RUNNER_TEMP/sniptide-docs-image.tar"
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          name: tested-docs-image-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sniptide-docs-image.tar
          retention-days: 1

  publish-docs-image:
    name: Publish tested docs image
    needs: [docker, checks, tests-result, e2e-result, docs-image]
    # A skipped job anywhere upstream, such as the editor extension build, would skip this job too.
    # Gate on the direct needs instead; checks, tests-result and e2e-result already judge skipped suites.
    if: ${{ !cancelled() && needs.docker.result == 'success' && needs.checks.result == 'success' && needs.tests-result.result == 'success' && needs.e2e-result.result == 'success' && needs.docs-image.result == 'success' && github.actor != 'dependabot[bot]' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Validate build attempt
        id: build
        env:
          BUILD_ATTEMPT: ${{ needs.docs-image.outputs.build-attempt }}
        run: |
          [[ "$BUILD_ATTEMPT" =~ ^[0-9]+$ ]] || exit 1
          echo "attempt=$BUILD_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: tested-docs-image-${{ steps.build.outputs.attempt }}
          path: ${{ runner.temp }}
      - run: docker load -i "$RUNNER_TEMP/sniptide-docs-image.tar"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image and receipt
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          ATTEMPT: ${{ steps.build.outputs.attempt }}
        run: |
          [[ "$REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ && "$SHA" =~ ^[a-f0-9]{40}$ && "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$ATTEMPT" =~ ^[0-9]+$ ]] || exit 1
          image="ghcr.io/${REPOSITORY,,}-docs:sha-$SHA-$GITHUB_RUN_ID-$ATTEMPT"
          docker tag sniptide-docs:ci "$image"
          output="$(docker push "$image")"
          digest="$(printf '%s\n' "$output" | sed -nE 's/.*digest: (sha256:[a-f0-9]{64}).*/\1/p' | tail -n 1)"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
          mkdir -p "$RUNNER_TEMP/docs-receipt"
          DIGEST="$digest" BUILD_ATTEMPT="$ATTEMPT" node -e 'const fs = require("fs"); const e = process.env; fs.writeFileSync(`${e.RUNNER_TEMP}/docs-receipt/receipt.json`, JSON.stringify({repository:e.GITHUB_REPOSITORY, sha:e.GITHUB_SHA, run_id:e.GITHUB_RUN_ID, run_attempt:e.GITHUB_RUN_ATTEMPT, build_attempt:e.BUILD_ATTEMPT, digest:e.DIGEST}))'
      - uses: actions/upload-artifact@v4
        with:
          name: docs-image-receipt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/docs-receipt/receipt.json
          retention-days: 7

  # Runs the store and routes against a real Postgres: the access rules and the one-time-read
  # claim live in SQL, so a mock would prove nothing.
  tests:
    name: Tests
    needs: plan
    if: needs.plan.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        postgres: [17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: sniptide
          POSTGRES_PASSWORD: sniptide
          POSTGRES_DB: sniptide_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sniptide -d sniptide_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://sniptide:sniptide@localhost:5432/sniptide_test
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - run: bun run test:web:integration
      - run: bun run test:admin

  # Branch protection requires a single result for both Postgres versions.
  tests-result:
    name: Tests
    needs: [plan, tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every selected Postgres version to pass
        env:
          PLAN: ${{ needs.plan.result }}
          SELECTED: ${{ needs.plan.outputs.web }}
          RESULT: ${{ needs.tests.result }}
        run: |
          [[ "$PLAN" == success &&
             ( ( "$SELECTED" == false && "$RESULT" == skipped ) ||
               ( "$SELECTED" == true && "$RESULT" == success ) ) ]]

  # Each shard has its own Postgres and builds the app with a warm Next cache.
  e2e:
    name: Browser tests shard ${{ matrix.shard }}
    needs: plan
    if: needs.plan.outputs.shards != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.shards) }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sniptide
          POSTGRES_PASSWORD: sniptide
          POSTGRES_DB: sniptide_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sniptide -d sniptide_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://sniptide:sniptide@localhost:5432/sniptide_e2e
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      # Next's build cache makes the second and later builds on a branch much faster.
      - uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('apps/web/**/*.ts', 'apps/web/**/*.tsx') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
      # The browser download is network-bound and the build is CPU-bound, so they run together.
      - name: Install the browser and build
        run: |
          bun --filter web test:e2e:install --with-deps &
          install=$!
          bun --filter web build
          wait "$install"
      - name: Run this shard's browser tests
        working-directory: apps/web
        env:
          SHARD_FILES: ${{ toJSON(matrix.files) }}
        run: |
          mapfile -d '' -t files < <(jq -j '.[] | ., "\u0000"' <<< "$SHARD_FILES")
          test "${#files[@]}" -gt 0
          bun run test:e2e "${files[@]}"
      - name: Publish browser test summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f apps/web/.e2e/summary.md ]; then
            cat apps/web/.e2e/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload browser reports and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: e2e-results-${{ matrix.shard }}
          path: |
            apps/web/.e2e/report.json
            apps/web/.e2e/junit.xml
            apps/web/.e2e/summary.md
            apps/web/.e2e/failures/
            apps/web/.e2e/artifacts/
            apps/web/.e2e/logs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  # Branch protection requires a check named "Browser tests", so this job reports one result for
  # both shards.
  e2e-result:
    name: Browser tests
    needs: [plan, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every selected shard to pass
        env:
          PLAN: ${{ needs.plan.result }}
          SHARDS: ${{ needs.plan.outputs.shards }}
          RESULT: ${{ needs.e2e.result }}
        run: |
          [[ "$PLAN" == success &&
             ( ( "$SHARDS" == '[]' && "$RESULT" == skipped ) ||
               ( "$SHARDS" != '[]' && "$RESULT" == success ) ) ]]
