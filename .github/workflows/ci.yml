name: CI

# Checks every pull request and every push to main. Publishing an image does not deploy it.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # scripts/attach-pr-media.sh adds .pr-media in one commit and removes it in the next, so the
      # screenshots in a pull request description never reach main.
      - name: Keep pull request media out of the tree
        run: test ! -e .pr-media || { echo "::error::Remove .pr-media before merging."; exit 1; }

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Next runs on Node; package.json asks for 24+.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install --global npm@12.2.1
      - run: bun install --frozen-lockfile
      - run: node --test scripts/test-npm-pack.mjs
      - run: npm pack @sniptide/mcp@0.1.0 --pack-destination "$RUNNER_TEMP"
      - run: node --test scripts/test-release-gates.mjs
        env:
          LEGACY_MCP_TARBALL: ${{ runner.temp }}/sniptide-mcp-0.1.0.tgz
      - run: bash scripts/test-ci-image-tag.sh
      - run: node --test scripts/test-deploy-production.mjs scripts/test-deploy-preview.mjs scripts/test-reconcile-previews.mjs scripts/test-healthcheck.mjs
      - run: node --test scripts/test-package-releases.mjs
      - run: node --test scripts/test-release-notes.mjs

      - run: bun run check

      - run: bun run test:cli
      - run: bun run test:mcp
      - run: bun run test:sdk
      - run: node packages/sdk/scripts/test-npm-release.mjs
      - run: node packages/mcp/scripts/test-npm-release.mjs
      - run: node scripts/npm-release.mjs ui "$RUNNER_TEMP/ui-package"
      - run: node packages/ui/scripts/test-npm-release.mjs "$RUNNER_TEMP/ui-package"
      - run: bun run test:docs

  # Build and test in parallel with the other checks; publishing waits for all of them.
  docker:
    name: Docker image, upgrade and compose
    outputs:
      build-attempt: ${{ github.run_attempt }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Build the Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: sniptide:ci
          build-args: DEPLOYMENT_VERSION=${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: |
            type=gha,scope=ci-web
            type=gha,scope=docker-amd64
          cache-to: type=gha,mode=max,scope=ci-web,ignore-error=true

      - name: Verify the Docker image against a fresh database
        run: bash scripts/test-docker.sh sniptide:ci

      # What a self-hoster does when they upgrade: seed a stack on the latest published release, back
      # it up, upgrade it to this image, then restore the backup into the running stack and into a
      # brand-new one, checking after each step that the data is intact.
      - name: Find the latest release image
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          image=""
          if [ -n "$tag" ]; then
            image="ghcr.io/${GITHUB_REPOSITORY,,}:${tag#v}"
            if ! docker manifest inspect "$image" >/dev/null 2>&1; then
              echo "::warning::$image isn't published yet, so the upgrade check is skipped."
              image=""
            fi
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Verify upgrading, backup and restore
        if: steps.previous.outputs.image != ''
        env:
          EXPECT_MIGRATION_LOG: "1"
          PREVIOUS_IMAGE: ${{ steps.previous.outputs.image }}
        run: bash scripts/test-upgrade.sh "$PREVIOUS_IMAGE" sniptide:ci

      # docker-compose.yml and the Coolify template, the two ways self-hosters start Sniptide.
      - name: Verify docker compose and the Coolify template
        run: bash scripts/test-compose.sh sniptide:ci

      - name: Select a tag for trusted events
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          ACTOR: ${{ github.actor }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          tag="$(bash scripts/ci-image-tag.sh "$REPOSITORY" "$EVENT" "$REF" "$HEAD_REPOSITORY" "$SHA" "$RUN_ID" "$ATTEMPT" "$ACTOR" "$AUTHOR")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Save the tested image
        if: steps.image.outputs.tag != ''
        run: docker save sniptide:ci -o "$RUNNER_TEMP/sniptide-image.tar"

      - name: Upload the tested image
        if: steps.image.outputs.tag != ''
        uses: actions/upload-artifact@v4
        with:
          name: tested-web-image-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sniptide-image.tar
          retention-days: 1

  publish-ci-image:
    name: Publish tested CI image
    needs: [docker, checks, tests, e2e-result, docs-image]
    if: ${{ github.actor != 'dependabot[bot]' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Validate the build attempt
        id: build
        env:
          BUILD_ATTEMPT: ${{ needs.docker.outputs.build-attempt }}
        run: |
          [[ "$BUILD_ATTEMPT" =~ ^[0-9]+$ ]] || { echo 'Invalid build attempt' >&2; exit 1; }
          echo "attempt=$BUILD_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: tested-web-image-${{ steps.build.outputs.attempt }}
          path: ${{ runner.temp }}
      - name: Load the tested image
        run: docker load -i "$RUNNER_TEMP/sniptide-image.tar"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested image
        id: publish
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ steps.build.outputs.attempt }}
        run: |
          if [[ ! "$REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] ||
             [[ ! "$SHA" =~ ^[a-f0-9]{40}$ ]] || [[ ! "$RUN_ID" =~ ^[0-9]+$ ]] ||
             [[ ! "$ATTEMPT" =~ ^[0-9]+$ ]]; then
            echo 'Invalid image destination inputs' >&2
            exit 1
          fi
          IMAGE="ghcr.io/${REPOSITORY,,}:sha-$SHA-$RUN_ID-$ATTEMPT"
          docker tag sniptide:ci "$IMAGE"
          output="$(docker push "$IMAGE")"
          printf '%s\n' "$output"
          digest="$(printf '%s\n' "$output" | sed -nE 's/.*digest: (sha256:[a-f0-9]{64}).*/\1/p' | tail -n 1)"
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo 'Could not find the pushed registry digest' >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published tested image: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Registry digest: \`${IMAGE%:*}@$digest\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Record the production image receipt
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          BUILD_ATTEMPT: ${{ steps.build.outputs.attempt }}
        run: |
          mkdir -p "$RUNNER_TEMP/image-receipt"
          node -e 'const fs = require("node:fs"); const e = process.env; fs.writeFileSync(`${e.RUNNER_TEMP}/image-receipt/receipt.json`, JSON.stringify({repository:e.GITHUB_REPOSITORY, sha:e.GITHUB_SHA, run_id:e.GITHUB_RUN_ID, run_attempt:e.GITHUB_RUN_ATTEMPT, build_attempt:e.BUILD_ATTEMPT, digest:e.DIGEST}))'
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          name: production-image-receipt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image-receipt/receipt.json
          retention-days: 7

      - name: Record the preview image receipt
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' && github.actor != 'dependabot[bot]' }}
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          BUILD_ATTEMPT: ${{ steps.build.outputs.attempt }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/preview-receipt"
          node -e 'const fs = require("node:fs"); const e = process.env; fs.writeFileSync(`${e.RUNNER_TEMP}/preview-receipt/receipt.json`, JSON.stringify({repository:e.GITHUB_REPOSITORY, merge_sha:e.GITHUB_SHA, head_sha:e.PR_HEAD, base_sha:e.PR_BASE, pr:e.PR_NUMBER, run_id:e.GITHUB_RUN_ID, run_attempt:e.GITHUB_RUN_ATTEMPT, build_attempt:e.BUILD_ATTEMPT, digest:e.DIGEST}))'
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' && github.actor != 'dependabot[bot]' }}
        with:
          name: preview-image-receipt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preview-receipt/receipt.json
          retention-days: 7

  # The docs site deploys as its own Coolify service from apps/docs/Dockerfile.
  docs-image:
    name: Docs Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build the docs Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/docs/Dockerfile
          load: true
          tags: sniptide-docs:ci
          cache-from: type=gha,scope=ci-docs
          cache-to: type=gha,mode=max,scope=ci-docs,ignore-error=true

      - name: Verify the docs Docker image
        run: bash scripts/test-docs-image.sh sniptide-docs:ci

  # Runs the store and routes against a real Postgres: the access rules and the one-time-read
  # claim live in SQL, so a mock would prove nothing.
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sniptide
          POSTGRES_PASSWORD: sniptide
          POSTGRES_DB: sniptide_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sniptide -d sniptide_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://sniptide:sniptide@localhost:5432/sniptide_test
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - run: bun run test:web:integration

  # Two shards split the test files between runners. Each has its own Postgres and builds the app,
  # which the Next build cache keeps cheap.
  e2e:
    name: Browser tests shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sniptide
          POSTGRES_PASSWORD: sniptide
          POSTGRES_DB: sniptide_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sniptide -d sniptide_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://sniptide:sniptide@localhost:5432/sniptide_e2e
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      # Next's build cache makes the second and later builds on a branch much faster.
      - uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('apps/web/**/*.ts', 'apps/web/**/*.tsx') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
      # The browser download is network-bound and the build is CPU-bound, so they run together.
      - name: Install the browser and build
        run: |
          bun --filter web test:e2e:install --with-deps &
          install=$!
          bun run build
          wait "$install"
      - name: Run this shard's browser tests
        working-directory: apps/web
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          files="$(ls tests/*.e2e.ts | sort | awk -v shard="$SHARD" 'NR % 2 == shard')"
          bun run test:e2e $files
      - name: Publish browser test summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f apps/web/.e2e/summary.md ]; then
            cat apps/web/.e2e/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload browser reports and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.shard }}
          path: |
            apps/web/.e2e/report.json
            apps/web/.e2e/junit.xml
            apps/web/.e2e/summary.md
            apps/web/.e2e/failures/
            apps/web/.e2e/artifacts/
            apps/web/.e2e/logs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  # Branch protection requires a check named "Browser tests", so this job reports one result for
  # both shards.
  e2e-result:
    name: Browser tests
    needs: e2e
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every shard to pass
        env:
          RESULT: ${{ needs.e2e.result }}
        run: test "$RESULT" = success
