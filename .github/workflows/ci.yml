name: CI

# Checks every pull request and every push to main. Deploys happen in Coolify, which builds
# the Dockerfile from main.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Next runs on Node; package.json asks for 24+.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install --global npm@12.2.1
      - run: bun install --frozen-lockfile
      - run: node --test scripts/test-npm-pack.mjs
      - run: npm pack @sniptide/mcp@0.1.0 --pack-destination "$RUNNER_TEMP"
      - run: node --test scripts/test-release-gates.mjs
        env:
          LEGACY_MCP_TARBALL: ${{ runner.temp }}/sniptide-mcp-0.1.0.tgz
      - run: node --test scripts/test-package-releases.mjs

      - run: bun run check

      - run: bun run test:cli
      - run: bun run test:mcp
      - run: bun run test:sdk
      - run: node packages/sdk/scripts/test-npm-release.mjs
      - run: node packages/mcp/scripts/test-npm-release.mjs
      - run: node scripts/npm-release.mjs ui "$RUNNER_TEMP/ui-package"
      - run: node packages/ui/scripts/test-npm-release.mjs "$RUNNER_TEMP/ui-package"
      - run: bun run test:docs

  # The same image Coolify deploys, so a broken Dockerfile shows up in the PR. Layers come from
  # the GitHub Actions cache, so the dependency install and the ffmpeg layer rarely rebuild.
  docker:
    name: Docker image, upgrade and compose
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build the Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: sniptide:ci
          cache-from: |
            type=gha,scope=ci-web
            type=gha,scope=docker-amd64
          cache-to: type=gha,mode=max,scope=ci-web,ignore-error=true

      - name: Verify the Docker image against a fresh database
        run: bash scripts/test-docker.sh sniptide:ci

      # What a self-hoster does when they upgrade: seed a stack on the latest published release, back
      # it up, upgrade it to this image, then restore the backup into the running stack and into a
      # brand-new one, checking after each step that the data is intact.
      - name: Find the latest release image
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          image=""
          if [ -n "$tag" ]; then
            image="ghcr.io/${GITHUB_REPOSITORY,,}:${tag#v}"
            if ! docker manifest inspect "$image" >/dev/null 2>&1; then
              echo "::warning::$image isn't published yet, so the upgrade check is skipped."
              image=""
            fi
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Verify upgrading, backup and restore
        if: steps.previous.outputs.image != ''
        env:
          EXPECT_MIGRATION_LOG: "1"
          PREVIOUS_IMAGE: ${{ steps.previous.outputs.image }}
        run: bash scripts/test-upgrade.sh "$PREVIOUS_IMAGE" sniptide:ci

      # docker-compose.yml and the Coolify template, the two ways self-hosters start Sniptide.
      - name: Verify docker compose and the Coolify template
        run: bash scripts/test-compose.sh sniptide:ci

  # The docs site deploys as its own Coolify service from apps/docs/Dockerfile.
  docs-image:
    name: Docs Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build the docs Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/docs/Dockerfile
          load: true
          tags: sniptide-docs:ci
          cache-from: type=gha,scope=ci-docs
          cache-to: type=gha,mode=max,scope=ci-docs,ignore-error=true

      - name: Verify the docs Docker image
        run: bash scripts/test-docs-image.sh sniptide-docs:ci

  # Runs the store and routes against a real Postgres: the access rules and the one-time-read
  # claim live in SQL, so a mock would prove nothing.
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sniptide
          POSTGRES_PASSWORD: sniptide
          POSTGRES_DB: sniptide_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sniptide -d sniptide_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://sniptide:sniptide@localhost:5432/sniptide_test
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - run: bun run test:web:integration

  # Two shards split the test files between runners. Each has its own Postgres and builds the app,
  # which the Next build cache keeps cheap.
  e2e:
    name: Browser tests shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sniptide
          POSTGRES_PASSWORD: sniptide
          POSTGRES_DB: sniptide_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sniptide -d sniptide_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://sniptide:sniptide@localhost:5432/sniptide_e2e
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      # Next's build cache makes the second and later builds on a branch much faster.
      - uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('apps/web/**/*.ts', 'apps/web/**/*.tsx') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
      # The browser download is network-bound and the build is CPU-bound, so they run together.
      - name: Install the browser and build
        run: |
          bun --filter web test:e2e:install --with-deps &
          install=$!
          bun run build
          wait "$install"
      - name: Run this shard's browser tests
        working-directory: apps/web
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          files="$(ls tests/*.e2e.ts | sort | awk -v shard="$SHARD" 'NR % 2 == shard')"
          bun run test:e2e $files
      - name: Publish browser test summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f apps/web/.e2e/summary.md ]; then
            cat apps/web/.e2e/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload browser reports and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.shard }}
          path: |
            apps/web/.e2e/report.json
            apps/web/.e2e/junit.xml
            apps/web/.e2e/summary.md
            apps/web/.e2e/failures/
            apps/web/.e2e/artifacts/
            apps/web/.e2e/logs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  # Branch protection requires a check named "Browser tests", so this job reports one result for
  # both shards.
  e2e-result:
    name: Browser tests
    needs: e2e
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every shard to pass
        env:
          RESULT: ${{ needs.e2e.result }}
        run: test "$RESULT" = success
