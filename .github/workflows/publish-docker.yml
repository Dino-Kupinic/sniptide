name: Publish Docker image

on:
  push:
    tags: ["v*.*.*", "[0-9]*.[0-9]*.[0-9]*"]
  workflow_call:
    inputs:
      tag:
        description: Version tag to build and publish
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build or retry
        required: true
        type: string

# Separate releases must not cancel each other when several tags are pushed.
concurrency:
  group: publish-docker-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    name: Build and verify (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Resolve the registry image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only
      - name: Require a semantic version
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: test -n "$IMAGE_TAGS"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: sniptide:release-test
          labels: ${{ steps.meta.outputs.labels }}
          build-args: DEPLOYMENT_VERSION=${{ steps.checkout.outputs.commit }}
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}
      - name: Verify migrations and the running image
        run: bash scripts/test-docker.sh sniptide:release-test
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Only publish images that passed the startup test, then combine them in one manifest.
      - uses: docker/build-push-action@v7
        id: push
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: DEPLOYMENT_VERSION=${{ steps.checkout.outputs.commit }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          provenance: false
      - name: Save image digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: docker-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  publish:
    name: Publish release tags
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}},value=${{ inputs.tag || github.ref_name }},enable=${{ !startsWith(inputs.tag || github.ref_name, 'v0.') && !startsWith(inputs.tag || github.ref_name, '0.') }}
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: docker-digest-*
          merge-multiple: true
      - name: Publish the multi-platform manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          image="${IMAGE,,}"
          args=()
          while IFS= read -r tag; do
            args+=(--tag "$tag")
          done <<< "$IMAGE_TAGS"
          for digest in *; do
            args+=("$image@sha256:$digest")
          done
          docker buildx imagetools create "${args[@]}"
