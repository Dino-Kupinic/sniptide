# Copy the backup service under services in deploy/coolify/sniptide.yaml. Copy the volume
# declaration to the top level. Build the image on the Docker host before redeploying.
# Setup and retention: https://docs.sniptide.com/self-hosting/backups#send-coolify-backups-offsite
services:
  backup:
    image: ${BACKUP_IMAGE:-sniptide-backup:local}
    pull_policy: never
    restart: unless-stopped
    environment:
      - PGHOST=postgres
      - PGUSER=${SERVICE_USER_POSTGRES}
      - PGPASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - PGDATABASE=${POSTGRES_DB:-sniptide}
      - BACKUP_BUCKET=${BACKUP_BUCKET:-}
      - BACKUP_AGE_RECIPIENT=${BACKUP_AGE_RECIPIENT:-}
      - BACKUP_HEARTBEAT_URL=${BACKUP_HEARTBEAT_URL:-}
      - BACKUP_B2_ENDPOINT=${BACKUP_B2_ENDPOINT:-}
      - BACKUP_B2_REGION=${BACKUP_B2_REGION:-}
      - BACKUP_B2_KEY_ID=${BACKUP_B2_KEY_ID:-}
      - BACKUP_B2_APP_KEY=${BACKUP_B2_APP_KEY:-}
    volumes:
      - sniptide-backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  sniptide-backups:
