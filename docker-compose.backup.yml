# Optional scheduled backups for docker-compose.yml: a small container that runs pg_dump on an
# interval and keeps the newest files. Start the stack with both files:
#
#   docker compose -f docker-compose.yml -f docker-compose.backup.yml up -d
#
# (or set COMPOSE_FILE=docker-compose.yml:docker-compose.backup.yml in .env). Files land in
# ./backups (BACKUP_DIR), named sniptide-<UTC time>.dump, and restore with scripts/restore.sh.
# They are on THIS server, so copy them off it (rsync, rclone, your provider's snapshots), and keep
# BETTER_AUTH_SECRET (and ENV_SECRETS_KEY, if set) with them: env groups can't be decrypted without it.
#
# Settings, all optional, in .env:
#   BACKUP_DIR=./backups          where the files go on the host
#   BACKUP_INTERVAL_HOURS=24      time between backups; the first one runs at start
#   BACKUP_KEEP_DAYS=14           backups older than this are deleted
services:
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: sniptide
      PGDATABASE: sniptide
      PGPASSWORD: ${POSTGRES_PASSWORD:-sniptide}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        umask 077
        interval="$${BACKUP_INTERVAL_SECONDS:-$$((BACKUP_INTERVAL_HOURS * 3600))}"
        while true; do
          file="/backups/sniptide-$$(date -u +%Y%m%dT%H%M%SZ).dump"
          if pg_dump --format=custom --no-owner --no-privileges --file="$$file.partial" \
              && pg_restore --list "$$file.partial" >/dev/null; then
            mv "$$file.partial" "$$file"
            echo "Backed up to $$file"
          else
            rm -f "$$file.partial"
            echo "Backup failed" >&2
          fi
          find /backups -maxdepth 1 -name 'sniptide-*.dump' -mtime "+$$BACKUP_KEEP_DAYS" -delete
          sleep "$$interval"
        done
