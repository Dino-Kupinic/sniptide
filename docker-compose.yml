# Sniptide with its Postgres database, ready to self-host.
#
# The quickest way in is the install script, which writes .env and starts this file:
#   curl -fsSL https://sniptide.com/install.sh | sh
#
# By hand, on a server whose DNS name points at it (ports 80 and 443 open):
#   printf 'BETTER_AUTH_SECRET=%s\nSNIPTIDE_DOMAIN=paste.example.com\nCOMPOSE_PROFILES=proxy\nSNIPTIDE_BIND=127.0.0.1\n' "$(openssl rand -hex 32)" > .env
#   docker compose up -d
#
# SNIPTIDE_DOMAIN alone sets the public https:// address, the bundled Caddy proxy's certificate
# and the client-IP settings behind it, and COMPOSE_PROFILES=proxy turns that proxy on. Without a
# domain, set BETTER_AUTH_URL=http://<server-ip>:3000 to check startup; copy buttons, password
# unlocks and CLI/MCP clients need HTTPS. Keep the secret: sessions depend on it. Add
# ALLOW_SIGN_UP=first to close sign-up once your own account exists. Every other setting in .env
# reaches the app as it is; .env.example lists the common ones.
#
# Local development: start only the database and run the app with `bun dev`:
#   docker compose up -d db
#
# Optional container ceilings are configured through SNIPTIDE_MEMORY and POSTGRES_MEMORY.

# Docker keeps container logs forever by default; the app writes a line per request.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  db:
    image: postgres:18-alpine
    # The 17 volume has PG_VERSION at its root. Refuse to initialize an empty 18 cluster over it.
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -f /var/lib/postgresql/PG_VERSION ]; then
          echo "PostgreSQL 17 data detected. Follow the PostgreSQL upgrade guide before starting." >&2
          exit 1
        fi
        exec docker-entrypoint.sh postgres
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEMORY:-0}
    logging: *logging
    environment:
      POSTGRES_USER: sniptide
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sniptide}
      POSTGRES_DB: sniptide
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ${POSTGRES_VOLUME:-postgres}:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sniptide -d sniptide"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: ${SNIPTIDE_IMAGE:-ghcr.io/dino-kupinic/sniptide:latest}
    build:
      context: .
      args:
        DEPLOYMENT_VERSION: ${DEPLOYMENT_VERSION:-}
    restart: unless-stopped
    mem_limit: ${SNIPTIDE_MEMORY:-0}
    memswap_limit: ${SNIPTIDE_MEMORY:-0}
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    # Every setting in .env reaches the app, so any option from apps/web/.env.example works by
    # adding it there. The values below are the ones this file derives or must check, and they win
    # over the same names in .env.
    env_file:
      - path: .env
        required: false
    environment:
      SNIPTIDE_EDITION: ${SNIPTIDE_EDITION:-selfhost}
      DATABASE_URL: postgres://sniptide:${POSTGRES_PASSWORD:-sniptide}@db:5432/sniptide
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET (openssl rand -hex 32) in .env}
      # The public address: BETTER_AUTH_URL when set, otherwise https://<SNIPTIDE_DOMAIN>, otherwise
      # http://localhost:3000.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-${SNIPTIDE_DOMAIN:+https://}${SNIPTIDE_DOMAIN:-http://localhost:3000}}
      # Where rate limits get the visitor's IP (see .env.example). With SNIPTIDE_DOMAIN set, the
      # bundled proxy is in front, so the defaults read X-Forwarded-For from private addresses.
      # Without it, "direct": people reach the app's port itself. Behind Cloudflare only, use
      # cloudflare.
      CLIENT_IP_SOURCE: ${CLIENT_IP_SOURCE:-${SNIPTIDE_DOMAIN:+x-forwarded-for}}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-${SNIPTIDE_DOMAIN:+private}}
    # Set SNIPTIDE_BIND=127.0.0.1 when the proxy (or another one on this host) is the only way in.
    ports:
      - "${SNIPTIDE_BIND:-0.0.0.0}:${SNIPTIDE_PORT:-3000}:3000"

  # Optional HTTPS reverse proxy: Caddy gets and renews a Let's Encrypt certificate for
  # SNIPTIDE_DOMAIN (whose DNS must point at this host, with ports 80 and 443 open). Turn it on
  # with COMPOSE_PROFILES=proxy in .env, or `docker compose --profile proxy up -d`. The app's
  # address and client-IP settings follow SNIPTIDE_DOMAIN on their own.
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    profiles: [proxy]
    depends_on:
      app:
        condition: service_healthy
    command: caddy reverse-proxy --from ${SNIPTIDE_DOMAIN:-localhost} --to app:3000
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres:
  postgres18:
  caddy-data:
  caddy-config:
