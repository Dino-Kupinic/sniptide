# Sniptide with its Postgres database, ready to self-host.
#
#   printf 'BETTER_AUTH_SECRET=%s\nBETTER_AUTH_URL=http://<server-ip>:3000\n' "$(openssl rand -hex 32)" > .env
#   docker compose up -d
#
# Keep the secret (sessions depend on it); BETTER_AUTH_URL is the exact address you open in the
# browser. Then open it and create your account. Every option is in .env.example. For
# HTTPS on your own domain, add the bundled Caddy proxy (see the "proxy" service below).
# Local development: start only the database and run the app with `bun dev`:
#   docker compose up -d db
#
# Memory: each container has a ceiling (SNIPTIDE_MEMORY, POSTGRES_MEMORY), so a busy app is
# restarted on its own instead of the kernel killing whatever else runs on the server. Raise them
# on a bigger server; NODE_OPTIONS sets the app's heap and should stay well below SNIPTIDE_MEMORY.

# Docker keeps container logs forever by default; the app writes a line per request.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEMORY:-512m}
    logging: *logging
    environment:
      POSTGRES_USER: sniptide
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sniptide}
      POSTGRES_DB: sniptide
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sniptide -d sniptide"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: ${SNIPTIDE_IMAGE:-ghcr.io/dino-kupinic/sniptide:latest}
    build:
      context: .
      args:
        DEPLOYMENT_VERSION: ${DEPLOYMENT_VERSION:-}
    restart: unless-stopped
    mem_limit: ${SNIPTIDE_MEMORY:-768m}
    # The same as mem_limit: no swap, so a runaway restarts at the ceiling instead of thrashing.
    memswap_limit: ${SNIPTIDE_MEMORY:-768m}
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=384}
      DATABASE_URL: postgres://sniptide:${POSTGRES_PASSWORD:-sniptide}@db:5432/sniptide
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET (openssl rand -hex 32) in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      ALLOW_SIGN_UP: ${ALLOW_SIGN_UP:-true}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_RESET_MINUTES: ${DEMO_RESET_MINUTES:-60}
      WAITLIST_URL: ${WAITLIST_URL:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ENV_SECRETS_KEY: ${ENV_SECRETS_KEY:-}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-}
      SHARE_URL: ${SHARE_URL:-}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_PREFIX: ${COOKIE_PREFIX:-}
      SHARE_PROXY_SECRET: ${SHARE_PROXY_SECRET:-}
      MAX_PASTE_SIZE: ${MAX_PASTE_SIZE:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-}
      POSTHOG_KEY: ${POSTHOG_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-10}
      DATABASE_IDLE_TIMEOUT_SECONDS: ${DATABASE_IDLE_TIMEOUT_SECONDS:-20}
      DATABASE_MAX_LIFETIME_SECONDS: ${DATABASE_MAX_LIFETIME_SECONDS:-1800}
      DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-10000}
      DATABASE_LOCK_TIMEOUT_MS: ${DATABASE_LOCK_TIMEOUT_MS:-3000}
      DATABASE_IDLE_TRANSACTION_TIMEOUT_MS: ${DATABASE_IDLE_TRANSACTION_TIMEOUT_MS:-15000}
      ACCOUNT_STORAGE_BYTES: ${ACCOUNT_STORAGE_BYTES:-}
      ACCOUNT_PASTE_LIMIT: ${ACCOUNT_PASTE_LIMIT:-}
      VIEW_HISTORY_RETENTION_DAYS: ${VIEW_HISTORY_RETENTION_DAYS:-90}
      ANALYTICS_RETENTION_DAYS: ${ANALYTICS_RETENTION_DAYS:-180}
      PURGE_BATCH_SIZE: ${PURGE_BATCH_SIZE:-500}
      PURGE_TIME_BUDGET_MS: ${PURGE_TIME_BUDGET_MS:-2000}
      HIGHLIGHT_CACHE_BYTES: ${HIGHLIGHT_CACHE_BYTES:-33554432}
      SLOW_QUERY_MS: ${SLOW_QUERY_MS:-500}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Where rate limits get the visitor's IP (see .env.example). "direct" is right when people
      # reach the app's port itself; behind the bundled proxy use x-forwarded-for with
      # TRUSTED_PROXIES=private, and behind Cloudflare only, cloudflare.
      CLIENT_IP_SOURCE: ${CLIENT_IP_SOURCE:-direct}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-}
    # Set SNIPTIDE_BIND=127.0.0.1 when the proxy (or another one on this host) is the only way in.
    ports:
      - "${SNIPTIDE_BIND:-0.0.0.0}:${SNIPTIDE_PORT:-3000}:3000"

  # Optional HTTPS reverse proxy: Caddy gets and renews a Let's Encrypt certificate for
  # SNIPTIDE_DOMAIN (whose DNS must point at this host, with ports 80 and 443 open). Turn it on with
  #   docker compose --profile proxy up -d
  # and set BETTER_AUTH_URL=https://<SNIPTIDE_DOMAIN>, CLIENT_IP_SOURCE=x-forwarded-for and
  # TRUSTED_PROXIES=private in .env.
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    profiles: [proxy]
    depends_on:
      app:
        condition: service_healthy
    command: caddy reverse-proxy --from ${SNIPTIDE_DOMAIN:-localhost} --to app:3000
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres:
  caddy-data:
  caddy-config:
