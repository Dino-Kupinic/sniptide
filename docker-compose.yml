# Sniptide with its Postgres database.
#
# Self-hosting: set BETTER_AUTH_SECRET (and BETTER_AUTH_URL to the URL you'll open), then
#   docker compose --profile app up -d
# Local development: start only the database and run the app with `bun dev`:
#   docker compose up -d db
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sniptide
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sniptide}
      POSTGRES_DB: sniptide
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sniptide -d sniptide"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://sniptide:${POSTGRES_PASSWORD:-sniptide}@db:5432/sniptide
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      SHARE_URL: ${SHARE_URL:-}
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-x-forwarded-for}
    ports:
      - "3000:3000"
    profiles: [app]

volumes:
  postgres:
